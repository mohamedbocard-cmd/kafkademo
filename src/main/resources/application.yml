server:
port: 8080
spring:
  application:
    name: order-service
    kafka:
      bootstrap-servers: localhost:9094   #Adresse du broker Kafka
      producer:
        key-serializer: org.apache.kafka.common.serialization.StringSerializer #Transforme la clé Java en données Kafka
        value-serializer: org.springframework.kafka.support.serializer.JsonSerializer #Transforme ton objet Java en JSON
        properties:
          spring.json.add.type.header: false  #Ajoute ou non les informations de type dans les headers JSON
          acks: all
          retries: 3  #Nombre de tentatives en cas d'échec
  Kafka:
    topics:
      orders: orders-topics #Nom du topic Kafka utilisé pour les commandes

    # acks: signifie que le producer attend que tous les brokers
    #répliqués nécessaires aient confirmé la réception du message.